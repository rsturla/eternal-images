name: Renovate CI

on:
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yml"
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Renovate Configuration
        uses: rsturla/eternal-main/.github/actions/validate-renovate-config@095b01ff182a751f08defa8649bc6fc488fecc76 # main
