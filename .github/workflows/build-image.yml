name: Build Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/build-iso.yml"
  schedule:
    - cron: "0 2 * * *" # Every day at 2am
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-gnome:
    uses: ./.github/workflows/_build-image.yml
    strategy:
      fail-fast: false
      matrix:
        major-version: [44]
        kernel-flavor: [default]
    secrets: inherit
    with:
      image-name: eternal-linux/lumina
      desktop-environment: gnome
      major-version: ${{ matrix.major-version }}
      is-release: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/main') }}
      platforms: amd64
      rechunk: false
      kernel-flavor: ${{ matrix.kernel-flavor }}
      build-context: .
      containerfile: ./lumina/Containerfile
      source-image: ghcr.io/rsturla/eternal-linux/main/silverblue
      compression-format: "zstd:chunked"

  build-gnome-nvidia:
    uses: ./.github/workflows/_build-image.yml
    strategy:
      fail-fast: false
      matrix:
        major-version: [44]
        kernel-flavor: [default]
    secrets: inherit
    with:
      image-name: eternal-linux/lumina
      desktop-environment: gnome
      major-version: ${{ matrix.major-version }}
      is-release: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/main') }}
      platforms: amd64
      rechunk: false
      kernel-flavor: ${{ matrix.kernel-flavor }}
      build-context: .
      containerfile: ./lumina/Containerfile
      source-image: ghcr.io/rsturla/eternal-linux/main/silverblue
      # This base contains kernel 7.1.13 and NVIDIA 610.57.04.
      source-image-ref: ghcr.io/rsturla/eternal-linux/main/silverblue@sha256:5122d5e06e1afa06862bf2a76ecc122d9db5243917053a59e793d6fd71f0dbd4
      is-nvidia: true
      compression-format: "zstd:chunked"

  build-cosmic:
    uses: ./.github/workflows/_build-image.yml
    strategy:
      fail-fast: false
      matrix:
        major-version: [44]
        kernel-flavor: [default]
    secrets: inherit
    with:
      image-name: eternal-linux/lumina-cosmic
      desktop-environment: cosmic
      major-version: ${{ matrix.major-version }}
      is-release: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/main') }}
      platforms: amd64
      rechunk: false
      kernel-flavor: ${{ matrix.kernel-flavor }}
      build-context: .
      containerfile: ./lumina/Containerfile
      source-image: ghcr.io/rsturla/eternal-linux/main/cosmic
      compression-format: "zstd:chunked"

  build-cosmic-nvidia:
    uses: ./.github/workflows/_build-image.yml
    strategy:
      fail-fast: false
      matrix:
        major-version: [44]
        kernel-flavor: [default]
    secrets: inherit
    with:
      image-name: eternal-linux/lumina-cosmic
      desktop-environment: cosmic
      major-version: ${{ matrix.major-version }}
      is-release: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/main') }}
      platforms: amd64
      rechunk: false
      kernel-flavor: ${{ matrix.kernel-flavor }}
      build-context: .
      containerfile: ./lumina/Containerfile
      source-image: ghcr.io/rsturla/eternal-linux/main/cosmic
      # Match the working NVIDIA driver and kernel while Cosmic packages update.
      source-image-ref: ghcr.io/rsturla/eternal-linux/main/cosmic@sha256:7735cfa6d3eb1fa28361e276126b78b479786c79259ef4589a8e563827a1c7d3
      is-nvidia: true
      compression-format: "zstd:chunked"

