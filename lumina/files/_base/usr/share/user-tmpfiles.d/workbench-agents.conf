# Project workbench-managed agent config and skills into each user's home.
#
# The per-user systemd-tmpfiles instance runs these on every login, so existing
# users get updates when the image changes (/etc/skel only applies at user
# creation). The canonical content lives read-only under /usr and is versioned
# with the image.
#
# The skills directory is a real, user-writable directory. Only the individual
# managed skills are symlinks, so users can still install their own skills
# alongside them. `L+` recreates each managed symlink on every run, keeping it
# in sync with the image.

# codex / AGENTS.md standard
d  %h/.agents                                   0755 - - -
d  %h/.agents/skills                            0755 - - -
L+ %h/.agents/skills/asd-ste100                 - - - - /usr/share/workbench/agents/skills/asd-ste100
L+ %h/.agents/skills/unslop                     - - - - /usr/share/workbench/agents/skills/unslop
L+ %h/.agents/skills/use-modern-go               - - - - /usr/share/workbench/agents/skills/use-modern-go
L+ %h/.agents/skills/writing-pull-requests      - - - - /usr/share/workbench/agents/skills/writing-pull-requests
L+ %h/AGENTS.md                                 - - - - /usr/share/workbench/agents/AGENTS.md

# Claude Code — read the same content
d  %h/.claude                                   0755 - - -
L+ %h/.claude/CLAUDE.md                         - - - - /usr/share/workbench/agents/AGENTS.md
L+ %h/.claude/skills                            - - - - %h/.agents/skills
